name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 接口测试（Node 22.11.0）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: local

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
          cache: npm
          cache-dependency-path: local/package-lock.json

      # 必须用 npm ci：走 better-sqlite3 的预编译产物，避免源码编译
      - name: 安装依赖
        run: npm ci

      - name: 本地接口测试
        run: npm run test:local

      - name: Edge Functions 测试
        run: npm run test:edge

  format:
    name: 代码格式检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      # 只检查前端样式与脚本（public/vendor 与 local/ 已在 .prettierignore 中排除）
      - name: Prettier 检查
        run: npx --yes prettier@3.4.2 --check "public/styles/**/*.css" "public/js/**/*.js" --ignore-path .prettierignore
