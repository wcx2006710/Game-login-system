<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>登录成功 | Game Login System</title>

  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/components.css">
  <script src="/js/icons.js"></script>

  <style>
    .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .welcome { display: flex; align-items: center; gap: 14px; }
    .avatar {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--c-success), #237804);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(82, 196, 26, 0.4);
    }
    .welcome-text h1 { font-size: 20px; }
    .welcome-text p { font-size: 13px; margin-top: 2px; }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--glass-border);
    }
    .card-title .icon { font-size: 18px; color: var(--c-primary-400); }
    .card-desc { font-size: 14px; margin-bottom: 16px; }

    @media (max-width: 768px) {
      .container { padding: 24px 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glass-card header">
      <div class="welcome">
        <div class="avatar" id="userAvatar">U</div>
        <div class="welcome-text">
          <h1>登录成功！欢迎回来<span class="badge badge-admin" id="userRole" style="display:none;margin-left:8px;">管理员</span></h1>
          <p class="muted" id="userInfo">加载中...</p>
        </div>
      </div>
      <div class="header-actions">
        <a class="btn btn-sm" href="/profile.html"><i class="icon" data-icon="user-cog"></i>个人中心</a>
        <button class="btn btn-sm btn-danger" onclick="logout()"><i class="icon" data-icon="log-out"></i>退出登录</button>
      </div>
    </div>

    <div class="glass-card" id="adminCard" style="margin-bottom:20px;display:none;">
      <h2 class="card-title"><i class="icon" data-icon="shield-check"></i>管理区</h2>
      <p class="card-desc muted">当前账号拥有管理员权限，可以新增、编辑和删除用户账号。</p>
      <a href="/admin.html" class="btn btn-primary"><i class="icon" data-icon="layout-dashboard"></i>进入用户管理后台</a>
    </div>

    <div class="glass-card" style="margin-bottom:20px;">
      <h2 class="card-title"><i class="icon" data-icon="gamepad-2"></i>娱乐区</h2>
      <p class="card-desc muted">登录成功，来玩一局扫雷放松一下吧！</p>
      <a href="/minesweeper.html" class="btn btn-primary"><i class="icon" data-icon="bomb"></i>开始扫雷游戏</a>
    </div>

    <div class="glass-card">
      <h2 class="card-title"><i class="icon" data-icon="users"></i>用户列表</h2>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>用户名</th>
              <th>邮箱</th>
              <th>角色</th>
              <th>注册时间</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="userTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/ui.js"></script>
  <script>
    function redirectToLogin() {
      window.location.href = '/login.html';
    }

    function showTableMessage(message) {
      const tbody = document.getElementById('userTable');
      tbody.replaceChildren();

      const row = document.createElement('tr');
      const cell = document.createElement('td');
      cell.colSpan = 6;
      cell.className = 'text-center dim';
      cell.textContent = message;

      row.appendChild(cell);
      tbody.appendChild(row);
    }

    async function loadUser() {
      try {
        const res = await fetch('/api/current-user');
        const data = await res.json();
        if (!data.loggedIn) {
          redirectToLogin();
          return;
        }

        const isAdmin = data.user.role === 'admin';

        document.getElementById('userInfo').textContent =
          '用户名：' + data.user.username +
          ' | 邮箱：' + (data.user.email || '未填写') +
          ' | 角色：' + (isAdmin ? '管理员' : '普通用户');
        document.getElementById('userAvatar').textContent =
          data.user.username.charAt(0).toUpperCase();

        if (isAdmin) {
          document.getElementById('userRole').style.display = 'inline-flex';
          document.getElementById('adminCard').style.display = 'block';
        }
      } catch (error) {
        document.getElementById('userInfo').textContent = '登录状态加载失败';
      }
    }

    async function loadUsers() {
      const tbody = document.getElementById('userTable');
      UI.renderSkeleton(tbody, 4, 6);

      try {
        const res = await fetch('/api/users');
        if (res.status === 401) {
          redirectToLogin();
          return;
        }

        const users = await res.json();
        if (!res.ok || !Array.isArray(users)) {
          throw new Error('用户数据格式错误');
        }

        tbody.replaceChildren();

        if (users.length === 0) {
          showTableMessage('暂无用户数据');
          return;
        }

        for (const user of users) {
          const row = document.createElement('tr');
          const values = [
            user.id ?? '-',
            user.username ?? '-',
            user.email || '-',
            user.created_at ? UI.formatDate(user.created_at) : '-'
          ];

          for (const value of values) {
            const cell = document.createElement('td');
            cell.textContent = String(value);
            row.appendChild(cell);
          }

          // 角色列
          const roleCell = document.createElement('td');
          const roleBadge = document.createElement('span');
          roleBadge.className = user.role === 'admin' ? 'badge badge-admin' : 'badge badge-user';
          roleBadge.textContent = user.role === 'admin' ? '管理员' : '普通用户';
          roleCell.appendChild(roleBadge);
          row.appendChild(roleCell);

          // 状态列
          const statusCell = document.createElement('td');
          const badge = document.createElement('span');
          badge.className = 'badge badge-success';
          badge.textContent = '正常';
          statusCell.appendChild(badge);
          row.appendChild(statusCell);

          tbody.appendChild(row);
        }
      } catch (error) {
        showTableMessage('用户列表加载失败，请刷新后重试');
      }
    }

    async function logout() {
      try {
        await fetch('/logout', { method: 'POST' });
      } finally {
        redirectToLogin();
      }
    }

    loadUser();
    loadUsers();
  </script>
</body>
</html>
