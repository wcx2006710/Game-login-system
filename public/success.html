<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录成功</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .header {
      background: #fff;
      padding: 24px 30px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .welcome { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 48px; height: 48px;
      background: #52c41a;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; font-weight: bold;
    }
    .welcome-text h1 { font-size: 20px; color: #333; }
    .welcome-text p { font-size: 13px; color: #888; margin-top: 2px; }
    .logout-btn {
      padding: 8px 20px;
      background: #ff4d4f;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .logout-btn:hover { background: #ff7875; }
    .card {
      background: #fff;
      padding: 24px 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .card h2 { font-size: 18px; color: #333; margin-bottom: 16px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
    }
    th {
      background: #fafafa;
      color: #666;
      font-weight: 600;
    }
    tr:hover { background: #f9f9f9; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      background: #e6f7ff;
      color: #1890ff;
      border-radius: 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="welcome">
        <div class="avatar" id="userAvatar">U</div>
        <div class="welcome-text">
          <h1>登录成功！欢迎回来</h1>
          <p id="userInfo">加载中...</p>
        </div>
      </div>
      <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <h2>🎮 娱乐区</h2>
      <p style="color:#666;font-size:14px;margin-bottom:16px;">登录成功，来玩一局扫雷放松一下吧！</p>
      <a href="/minesweeper.html" style="display:inline-block;padding:10px 28px;background:#722ed1;color:#fff;border-radius:6px;text-decoration:none;font-size:15px;">开始扫雷游戏 →</a>
    </div>

    <div class="card">
      <h2>用户列表</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>用户名</th>
            <th>邮箱</th>
            <th>注册时间</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="userTable">
          <tr><td colspan="5" style="text-align:center;color:#999;">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadUser() {
      const res = await fetch('/api/current-user');
      const data = await res.json();
      if (!data.loggedIn) {
        window.location.href = '/login.html';
        return;
      }
      document.getElementById('userInfo').textContent =
        `用户名：${data.user.username} | 邮箱：${data.user.email}`;
      document.getElementById('userAvatar').textContent =
        data.user.username.charAt(0).toUpperCase();
    }

    async function loadUsers() {
      const res = await fetch('/api/users');
      if (res.status === 401) {
        window.location.href = '/login.html';
        return;
      }
      const users = await res.json();
      const tbody = document.getElementById('userTable');
      tbody.innerHTML = users.map(u => `
        <tr>
          <td>${u.id}</td>
          <td>${u.username}</td>
          <td>${u.email || '-'}</td>
          <td>${u.created_at}</td>
          <td><span class="badge">正常</span></td>
        </tr>
      `).join('');
    }

    async function logout() {
      await fetch('/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }

    loadUser();
    loadUsers();
  </script>
</body>
</html>
