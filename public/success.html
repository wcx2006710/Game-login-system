<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>登录成功</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .header {
      background: #fff;
      padding: 24px 30px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .welcome { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 48px; height: 48px;
      background: #52c41a;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; font-weight: bold;
    }
    .welcome-text h1 { font-size: 20px; color: #333; }
    .welcome-text p { font-size: 13px; color: #888; margin-top: 2px; }
    .logout-btn {
      padding: 8px 20px;
      background: #ff4d4f;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .logout-btn:hover { background: #ff7875; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .link-btn {
      padding: 8px 18px;
      background: #fff;
      color: #333;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      font-size: 14px;
      text-decoration: none;
    }
    .link-btn:hover { border-color: #1890ff; color: #1890ff; }
    .card {
      background: #fff;
      padding: 24px 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .card h2 { font-size: 18px; color: #333; margin-bottom: 16px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #f0f0f0;
    }
    th {
      background: #fafafa;
      color: #666;
      font-weight: 600;
    }
    tr:hover { background: #f9f9f9; }
    .badge {
      display: inline-block;
      padding: 2px 10px;
      background: #e6f7ff;
      color: #1890ff;
      border-radius: 10px;
      font-size: 12px;
    }
    .badge-admin { background: #f9f0ff; color: #722ed1; }
    .role-badge {
      display: none;
      margin-left: 8px;
      padding: 2px 10px;
      background: #f9f0ff;
      color: #722ed1;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      vertical-align: middle;
    }
    .role-badge.show { display: inline-block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="welcome">
        <div class="avatar" id="userAvatar">U</div>
        <div class="welcome-text">
          <h1>登录成功！欢迎回来<span class="role-badge" id="userRole">管理员</span></h1>
          <p id="userInfo">加载中...</p>
        </div>
      </div>
      <div class="header-actions">
        <a class="link-btn" href="/profile.html">个人中心</a>
        <button class="logout-btn" onclick="logout()">退出登录</button>
      </div>
    </div>

    <div class="card" id="adminCard" style="margin-bottom:20px;display:none;">
      <h2>🛠️ 管理区</h2>
      <p style="color:#666;font-size:14px;margin-bottom:16px;">当前账号拥有管理员权限，可以新增、编辑和删除用户账号。</p>
      <a href="/admin.html" style="display:inline-block;padding:10px 28px;background:#722ed1;color:#fff;border-radius:6px;text-decoration:none;font-size:15px;">进入用户管理后台 →</a>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <h2>🎮 娱乐区</h2>
      <p style="color:#666;font-size:14px;margin-bottom:16px;">登录成功，来玩一局扫雷放松一下吧！</p>
      <a href="/minesweeper.html" style="display:inline-block;padding:10px 28px;background:#722ed1;color:#fff;border-radius:6px;text-decoration:none;font-size:15px;">开始扫雷游戏 →</a>
    </div>

    <div class="card">
      <h2>用户列表</h2>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>用户名</th>
            <th>邮箱</th>
            <th>注册时间</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="userTable">
          <tr><td colspan="5" style="text-align:center;color:#999;">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function redirectToLogin() {
      window.location.href = '/login.html';
    }

    function showTableMessage(message) {
      const tbody = document.getElementById('userTable');
      tbody.replaceChildren();

      const row = document.createElement('tr');
      const cell = document.createElement('td');
      cell.colSpan = 5;
      cell.style.textAlign = 'center';
      cell.style.color = '#999';
      cell.textContent = message;

      row.appendChild(cell);
      tbody.appendChild(row);
    }

    async function loadUser() {
      try {
        const res = await fetch('/api/current-user');
        const data = await res.json();
        if (!data.loggedIn) {
          redirectToLogin();
          return;
        }

        const isAdmin = data.user.role === 'admin';

        document.getElementById('userInfo').textContent =
          `用户名：${data.user.username} | 邮箱：${data.user.email || '未填写'} | 角色：${isAdmin ? '管理员' : '普通用户'}`;
        document.getElementById('userAvatar').textContent =
          data.user.username.charAt(0).toUpperCase();

        if (isAdmin) {
          document.getElementById('userRole').classList.add('show');
          document.getElementById('adminCard').style.display = 'block';
        }
      } catch (error) {
        document.getElementById('userInfo').textContent = '登录状态加载失败';
      }
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/users');
        if (res.status === 401) {
          redirectToLogin();
          return;
        }

        const users = await res.json();
        if (!res.ok || !Array.isArray(users)) {
          throw new Error('用户数据格式错误');
        }

        const tbody = document.getElementById('userTable');
        tbody.replaceChildren();

        if (users.length === 0) {
          showTableMessage('暂无用户数据');
          return;
        }

        for (const user of users) {
          const row = document.createElement('tr');
          const values = [
            user.id ?? '-',
            user.username ?? '-',
            user.email || '-',
            user.created_at || '-'
          ];

          for (const value of values) {
            const cell = document.createElement('td');
            cell.textContent = String(value);
            row.appendChild(cell);
          }

          const statusCell = document.createElement('td');
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = '正常';
          statusCell.appendChild(badge);
          row.appendChild(statusCell);
          tbody.appendChild(row);
        }
      } catch (error) {
        showTableMessage('用户列表加载失败，请刷新后重试');
      }
    }

    async function logout() {
      try {
        await fetch('/logout', { method: 'POST' });
      } finally {
        redirectToLogin();
      }
    }

    loadUser();
    loadUsers();
  </script>
</body>
</html>
