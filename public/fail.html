<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录失败</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fail-box {
      background: #fff;
      padding: 50px 40px;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      width: 380px;
      text-align: center;
    }
    .icon {
      width: 80px; height: 80px;
      background: #fff1f0;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
    }
    h2 { color: #cf1322; margin-bottom: 12px; font-size: 24px; }
    p { color: #666; font-size: 14px; line-height: 1.8; margin-bottom: 30px; }
    .btn {
      display: inline-block;
      padding: 12px 36px;
      background: #cf1322;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s;
    }
    .btn:hover { background: #a8071a; }
    .retry-info {
      margin-top: 24px;
      padding: 14px;
      background: #fafafa;
      border-radius: 6px;
      font-size: 12px;
      color: #999;
      line-height: 1.8;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="fail-box">
    <div class="icon">❌</div>
    <h2>登录失败</h2>
    <p>用户名或密码错误，请检查后重新尝试。<br>连续多次失败可能导致账户锁定。</p>
    <a href="/login.html" class="btn">返回登录</a>
    <div class="retry-info">
      提示：<br>
      • 确认用户名大小写是否正确<br>
      • 确认密码是否输入正确<br>
      • 测试账号：admin / 123456
    </div>
  </div>
</body>
</html>
