<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>个人中心 | Game Login System</title>

  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/components.css">
  <script src="/js/icons.js"></script>

  <style>
    .container { max-width: 720px; margin: 0 auto; padding: 40px 20px; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .welcome { display: flex; align-items: center; gap: 14px; }
    .avatar {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(102, 126, 234, 0.4);
    }
    .welcome-text h1 { font-size: 20px; }
    .welcome-text p { font-size: 13px; margin-top: 2px; }

    .card-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--glass-border);
    }
    .card-title .icon { font-size: 18px; color: var(--c-primary-400); }

    .info-row {
      display: flex;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 14px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { width: 100px; flex-shrink: 0; color: var(--fg-dim); }
    .info-value { color: var(--fg); word-break: break-all; }

    .field { margin-bottom: 16px; }
    .field label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--fg-muted); }
    .field .hint { margin-top: 6px; font-size: 12px; color: var(--fg-dim); }
    .actions { display: flex; align-items: center; gap: 12px; }

    /* 兼容旧脚本的错误容器，提示统一走 Toast */
    .message { display: none; }

    @media (max-width: 768px) {
      .container { padding: 24px 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glass-card header">
      <div class="welcome">
        <div class="avatar" id="userAvatar">U</div>
        <div class="welcome-text">
          <h1>个人中心</h1>
          <p class="muted" id="welcomeSub">加载中...</p>
        </div>
      </div>
      <div class="header-actions">
        <a class="btn btn-sm" href="/success.html"><i class="icon" data-icon="house"></i>返回主页</a>
        <button class="btn btn-sm btn-danger" id="logoutBtn"><i class="icon" data-icon="log-out"></i>退出登录</button>
      </div>
    </div>

    <div class="glass-card card">
      <h2 class="card-title"><i class="icon" data-icon="user-cog"></i>账号信息</h2>
      <div class="info-list">
        <div class="info-row">
          <div class="info-label">用户名</div>
          <div class="info-value" id="infoUsername">-</div>
        </div>
        <div class="info-row">
          <div class="info-label">角色</div>
          <div class="info-value" id="infoRole">-</div>
        </div>
        <div class="info-row">
          <div class="info-label">邮箱</div>
          <div class="info-value" id="infoEmail">-</div>
        </div>
        <div class="info-row">
          <div class="info-label">注册时间</div>
          <div class="info-value" id="infoCreatedAt">-</div>
        </div>
      </div>
    </div>

    <div class="glass-card card">
      <h2 class="card-title"><i class="icon" data-icon="mail"></i>修改邮箱</h2>
      <form id="emailForm" novalidate>
        <div class="field">
          <label for="email">新邮箱</label>
          <input class="input" type="email" id="email" autocomplete="email" placeholder="留空表示清除邮箱">
          <div class="hint">邮箱用于账号标识，不能与其他账号重复。</div>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="emailSubmit"><i class="icon" data-icon="save"></i>保存邮箱</button>
        </div>
      </form>
      <div class="message" id="emailMessage"></div>
    </div>

    <div class="glass-card card">
      <h2 class="card-title"><i class="icon" data-icon="key-round"></i>修改密码</h2>
      <form id="passwordForm" novalidate>
        <div class="field">
          <label for="currentPassword">当前密码</label>
          <input class="input" type="password" id="currentPassword" autocomplete="current-password" placeholder="请输入当前密码">
        </div>
        <div class="field">
          <label for="newPassword">新密码</label>
          <input class="input" type="password" id="newPassword" autocomplete="new-password" placeholder="至少 6 位">
        </div>
        <div class="field">
          <label for="confirmPassword">确认新密码</label>
          <input class="input" type="password" id="confirmPassword" autocomplete="new-password" placeholder="再次输入新密码">
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="passwordSubmit"><i class="icon" data-icon="shield-check"></i>更新密码</button>
        </div>
      </form>
      <div class="message" id="passwordMessage"></div>
    </div>
  </div>

  <script src="/js/ui.js"></script>
  <script>
    const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const MIN_PASSWORD_LENGTH = 6;

    const emailForm = document.getElementById('emailForm');
    const passwordForm = document.getElementById('passwordForm');
    const emailSubmit = document.getElementById('emailSubmit');
    const passwordSubmit = document.getElementById('passwordSubmit');

    function redirectToLogin() { window.location.href = '/login.html'; }

    async function requestJson(url, options) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      return { response, data };
    }

    function renderUser(user) {
      const isAdmin = user.role === 'admin';

      document.getElementById('userAvatar').textContent =
        user.username.charAt(0).toUpperCase();
      document.getElementById('welcomeSub').textContent =
        user.username + '（' + (isAdmin ? '管理员' : '普通用户') + '）';
      document.getElementById('infoUsername').textContent = user.username;
      document.getElementById('infoEmail').textContent = user.email || '未填写';
      document.getElementById('infoCreatedAt').textContent = UI.formatDate(user.created_at);
      document.getElementById('email').value = user.email || '';

      const roleBox = document.getElementById('infoRole');
      roleBox.replaceChildren();
      const badge = document.createElement('span');
      badge.className = isAdmin ? 'badge badge-admin' : 'badge badge-user';
      badge.textContent = isAdmin ? '管理员' : '普通用户';
      roleBox.appendChild(badge);
    }

    emailForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      if (email && !EMAIL_PATTERN.test(email)) {
        UI.toast('邮箱格式不正确', 'error');
        return;
      }

      try {
        await UI.withSpinner(emailSubmit, async () => {
          const { response, data } = await requestJson('/api/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });

          if (response.status === 401) { redirectToLogin(); return; }
          if (!response.ok) {
            UI.toast(data.error || ('保存失败（HTTP ' + response.status + '）'), 'error');
            return;
          }

          renderUser(data.user);
          UI.toast('邮箱已更新', 'success');
        });
      } catch (error) {
        UI.toast('无法连接服务器，请确认服务已启动', 'error');
      }
    });

    passwordForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!currentPassword) { UI.toast('请输入当前密码', 'error'); return; }
      if (newPassword.length < MIN_PASSWORD_LENGTH) {
        UI.toast('新密码至少需要 ' + MIN_PASSWORD_LENGTH + ' 位', 'error');
        return;
      }
      if (newPassword !== confirmPassword) { UI.toast('两次输入的新密码不一致', 'error'); return; }
      if (newPassword === currentPassword) { UI.toast('新密码不能与当前密码相同', 'error'); return; }

      try {
        await UI.withSpinner(passwordSubmit, async () => {
          const { response, data } = await requestJson('/api/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ currentPassword, newPassword })
          });

          if (response.status === 401) { redirectToLogin(); return; }
          if (!response.ok) {
            UI.toast(data.error || ('更新失败（HTTP ' + response.status + '）'), 'error');
            return;
          }

          passwordForm.reset();
          UI.toast(data.message || '密码已更新', 'success');
        });
      } catch (error) {
        UI.toast('无法连接服务器，请确认服务已启动', 'error');
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await fetch('/logout', { method: 'POST' });
      } finally {
        redirectToLogin();
      }
    });

    (async function init() {
      const { response, data } = await requestJson('/api/current-user');
      if (!response.ok || !data.loggedIn) { redirectToLogin(); return; }
      renderUser(data.user);
    })();
  </script>
</body>
</html>
