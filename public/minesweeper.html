<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>扫雷游戏 | Game Login System</title>

  <link rel="stylesheet" href="/styles/theme.css">
  <script src="/js/icons.js"></script>

  <style>
    /* 只套外壳：容器、标题、按钮改为暗色玻璃；棋盘配色保持原样以保证可读性 */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .header {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    #userLabel { color: var(--fg-muted); font-size: 14px; }

    .game-container { width: 100%; max-width: 520px; }

    h1 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      font-size: 24px;
      margin-bottom: 16px;
    }
    h1 .icon { font-size: 22px; color: var(--c-danger); }

    .game-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: var(--r-md);
    }
    .info-item { font-size: 15px; font-weight: 700; color: var(--fg); }
    .info-item span { color: var(--c-danger); }

    /* ===== 棋盘：已套暗色，但保留经典数字色相（蓝1绿2红3 的通用约定不动，只提亮） ===== */
    .board {
      display: grid;
      grid-template-columns: repeat(9, 36px);
      gap: 2px;
      background: #23263a;
      padding: 4px;
      border-radius: 6px;
      user-select: none;
      box-shadow: var(--sh-1);
    }
    .cell {
      width: 36px;
      height: 36px;
      background: #2e3250;
      /* 用 inset 高光保留经典 Windows 的立体感，而非 outset 灰白 */
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
    }
    .cell:hover { background: #39406a; transform: translateY(-1px); }
    .cell.revealed { background: #1b1e30; box-shadow: none; cursor: default; }
    .cell.mine { background: #ff4d4f; }
    .cell.flagged { color: #ff7875; }
    .cell[data-num="1"] { color: #5aa9ff; }
    .cell[data-num="2"] { color: #73d13d; }
    .cell[data-num="3"] { color: #ff7875; }
    .cell[data-num="4"] { color: #b37feb; }
    .cell[data-num="5"] { color: #ffa940; }
    .cell[data-num="6"] { color: #5cdbd3; }
    .cell[data-num="7"] { color: #e8eaf2; }
    .cell[data-num="8"] { color: #8c8fa8; }

    .message {
      text-align: center;
      margin-top: 16px;
      font-size: 18px;
      font-weight: 700;
      min-height: 24px;
    }
    .message.win { color: var(--c-success); }
    .message.lose { color: #ff7875; }
    .tip { margin-top: 12px; font-size: 12px; text-align: center; color: var(--fg-dim); }

    @media (max-width: 480px) {
      .board { grid-template-columns: repeat(9, 32px); }
      .cell { width: 32px; height: 32px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="/success.html" class="btn btn-sm"><i class="icon" data-icon="house"></i>返回首页</a>
    <span id="userLabel"></span>
  </div>

  <div class="glass-card game-container">
    <h1><i class="icon" data-icon="bomb"></i>扫雷游戏</h1>
    <div class="game-info">
      <div class="info-item">剩余雷数：<span id="mineCount">10</span></div>
      <button class="btn btn-sm" onclick="initGame()"><i class="icon" data-icon="loader-circle"></i>重新开始</button>
      <div class="info-item">用时：<span id="timer">0</span>s</div>
    </div>
    <div class="board" id="board"></div>
    <div class="message" id="message"></div>
    <div class="tip">左键翻开格子 | 右键标记/取消旗帜</div>
  </div>

  <script>
    const ROWS = 9, COLS = 9, MINES = 10;
    let board = [], revealed = [], flagged = [];
    let gameOver = false, firstClick = true;
    let timer = 0, timerInterval = null;

    async function checkLogin() {
      try {
        const res = await fetch('/api/current-user');
        const data = await res.json();
        if (!data.loggedIn) {
          window.location.href = '/login.html';
          return false;
        }

        document.getElementById('userLabel').textContent = '玩家：' + data.user.username;
        return true;
      } catch (error) {
        document.getElementById('userLabel').textContent = '登录状态检查失败';
        document.getElementById('message').textContent = '无法连接服务器，请稍后重试';
        document.getElementById('message').className = 'message lose';
        return false;
      }
    }

    function initGame() {
      board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
      revealed = Array.from({length: ROWS}, () => Array(COLS).fill(false));
      flagged = Array.from({length: ROWS}, () => Array(COLS).fill(false));
      gameOver = false; firstClick = true; timer = 0;
      clearInterval(timerInterval);
      document.getElementById('timer').textContent = '0';
      document.getElementById('mineCount').textContent = MINES;
      document.getElementById('message').textContent = '';
      document.getElementById('message').className = 'message';
      renderBoard();
    }

    function placeMines(safeR, safeC) {
      let placed = 0;
      while (placed < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if (board[r][c] === -1) continue;
        if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
        board[r][c] = -1;
        placed++;
      }
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c] === -1) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc] === -1) count++;
            }
          }
          board[r][c] = count;
        }
      }
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.r = r; cell.dataset.c = c;
          if (revealed[r][c]) {
            cell.classList.add('revealed');
            if (board[r][c] === -1) { cell.classList.add('mine'); cell.textContent = '💣'; }
            else if (board[r][c] > 0) { cell.textContent = board[r][c]; cell.dataset.num = board[r][c]; }
          } else if (flagged[r][c]) {
            cell.classList.add('flagged');
            cell.textContent = '🚩';
          }
          cell.tabIndex = 0;
          cell.setAttribute('role', 'button');
          cell.setAttribute('aria-label', '第 ' + (r + 1) + ' 行，第 ' + (c + 1) + ' 列');
          cell.addEventListener('click', () => handleClick(r, c));
          cell.addEventListener('contextmenu', (e) => { e.preventDefault(); handleRightClick(r, c); });
          cell.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              handleClick(r, c);
            } else if (e.key.toLowerCase() === 'f') {
              e.preventDefault();
              handleRightClick(r, c);
            }
          });
          boardEl.appendChild(cell);
        }
      }
    }

    function handleClick(r, c) {
      if (gameOver || revealed[r][c] || flagged[r][c]) return;
      if (firstClick) {
        placeMines(r, c);
        firstClick = false;
        timerInterval = setInterval(() => { timer++; document.getElementById('timer').textContent = timer; }, 1000);
      }
      reveal(r, c);
      if (board[r][c] === -1) {
        gameOver = true;
        clearInterval(timerInterval);
        for (let i = 0; i < ROWS; i++) for (let j = 0; j < COLS; j++) if (board[i][j] === -1) revealed[i][j] = true;
        document.getElementById('message').textContent = '💥 游戏结束！踩到雷了';
        document.getElementById('message').className = 'message lose';
      } else {
        checkWin();
      }
      renderBoard();
    }

    function reveal(r, c) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
      if (revealed[r][c] || flagged[r][c]) return;
      revealed[r][c] = true;
      if (board[r][c] === 0) {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            reveal(r + dr, c + dc);
          }
        }
      }
    }

    function handleRightClick(r, c) {
      if (gameOver || revealed[r][c]) return;
      flagged[r][c] = !flagged[r][c];
      const flagCount = flagged.flat().filter(Boolean).length;
      document.getElementById('mineCount').textContent = MINES - flagCount;
      renderBoard();
    }

    function checkWin() {
      let unrevealed = 0;
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (!revealed[r][c]) unrevealed++;
      if (unrevealed === MINES) {
        gameOver = true;
        clearInterval(timerInterval);
        document.getElementById('message').textContent = '🎉 恭喜获胜！用时 ' + timer + ' 秒';
        document.getElementById('message').className = 'message win';
      }
    }

    async function bootstrap() {
      if (await checkLogin()) initGame();
    }

    bootstrap();
  </script>
</body>
</html>
