<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>用户登录 | Game Login System</title>

  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/components.css">
  <script src="/js/icons.js"></script>

  <style>
    body {
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    #gameCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: var(--z-canvas);
    }
    .login-wrapper {
      position: relative;
      z-index: var(--z-content);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .login-box {
      pointer-events: auto;
      width: 380px;
      max-width: calc(100vw - 40px);
      animation: fadeIn 0.5s var(--ease) both;
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--c-primary-400);
    }
    .brand .icon { font-size: 18px; }
    h2 { text-align: center; font-size: 26px; margin-bottom: 26px; }

    .hint {
      margin-top: 20px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: var(--r-md);
      font-size: 12px;
      color: var(--fg-dim);
      line-height: 1.9;
    }
    .hint code {
      color: var(--c-primary-400);
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .switch-link { margin-top: 16px; text-align: center; font-size: 13px; color: var(--fg-dim); }
    .switch-link a { display: inline-flex; align-items: center; gap: 5px; }

    .bomb-tip {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(11, 11, 26, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: var(--r-pill);
      color: var(--fg-dim);
      font-size: 13px;
      z-index: var(--z-content);
      pointer-events: none;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    .bomb-tip .icon { font-size: 14px; color: var(--c-warning); }

    /* 死亡覆盖层 */
    #deathOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: var(--z-overlay);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.5s;
    }
    #deathOverlay.show { display: flex; }
    .death-text {
      font-size: 68px;
      color: var(--c-danger);
      font-weight: 800;
      text-shadow: 0 0 30px var(--c-danger);
      margin-bottom: 20px;
      animation: shake 0.5s infinite;
    }
    .death-sub {
      font-size: 20px;
      color: var(--fg);
      margin-bottom: 40px;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    body.death { animation: screenShake 0.3s; }
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-10px, 5px); }
      40% { transform: translate(10px, -5px); }
      60% { transform: translate(-5px, 10px); }
      80% { transform: translate(5px, -10px); }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div class="login-wrapper">
    <div class="glass-card login-box">
      <div class="brand"><i class="icon" data-icon="bomb"></i> Game Login</div>
      <h2>用户登录</h2>
      <form id="loginForm">
        <div class="float-label">
          <input class="input" type="text" id="username" name="username" required placeholder=" ">
          <label for="username">用户名</label>
        </div>
        <div class="float-label">
          <input class="input" type="password" id="password" name="password" required placeholder=" ">
          <label for="password">密码</label>
        </div>
        <button type="submit" class="btn btn-primary btn-block"><i class="icon" data-icon="log-in"></i>登 录</button>
      </form>
      <div class="hint">
        测试账号：<br>
        <code>wcx / dashuaige</code><br>
        <code>admin / 123456</code>（管理员）<br>
        <code>test / test123</code>
      </div>
      <div class="switch-link">
        还没有账号？<a href="/register.html"><i class="icon" data-icon="user-plus"></i>立即注册</a>
      </div>
    </div>
  </div>

  <div class="bomb-tip"><i class="icon" data-icon="zap"></i>点击背景中的炸弹会爆炸，登录失败会触发全图爆炸！</div>

  <div id="deathOverlay">
    <div class="death-text">💥 你被炸死了 💥</div>
    <div class="death-sub">用户名或密码错误，炸弹已被引爆</div>
    <button class="btn btn-danger" onclick="respawn()"><i class="icon" data-icon="loader-circle"></i>重新来过</button>
  </div>

  <script src="/js/ui.js"></script>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    let bgGradient;
    let bombs = [];
    let particles = [];
    let isDead = false;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      // 缓存渐变，避免每帧重建
      bgGradient = ctx.createLinearGradient(0, 0, W, H);
      bgGradient.addColorStop(0, '#1a1a2e');
      bgGradient.addColorStop(0.5, '#16213e');
      bgGradient.addColorStop(1, '#0f3460');
    }
    resize();
    window.addEventListener('resize', resize);

    // 炸弹类
    class Bomb {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 22;
        this.exploded = false;
        this.pulse = Math.random() * Math.PI * 2;
        this.floatOffset = Math.random() * Math.PI * 2;
        this.baseY = y;
      }
      update() {
        this.pulse += 0.05;
        this.floatOffset += 0.02;
        this.y = this.baseY + Math.sin(this.floatOffset) * 8;
      }
      draw() {
        if (this.exploded) return;
        const scale = 1 + Math.sin(this.pulse) * 0.08;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(scale, scale);
        // 引线
        ctx.strokeStyle = '#8B4513';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(5, -this.radius + 2);
        ctx.quadraticCurveTo(15, -this.radius - 10, 20, -this.radius - 5);
        ctx.stroke();
        // 火花
        ctx.fillStyle = '#ff6600';
        ctx.beginPath();
        ctx.arc(20, -this.radius - 5, 3 + Math.sin(this.pulse * 3) * 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(20, -this.radius - 5, 1.5, 0, Math.PI * 2);
        ctx.fill();
        // 炸弹主体
        const gradient = ctx.createRadialGradient(-5, -5, 2, 0, 0, this.radius);
        gradient.addColorStop(0, '#555');
        gradient.addColorStop(1, '#1a1a1a');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        // 高光
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.arc(-7, -7, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      contains(px, py) {
        const dx = px - this.x, dy = py - this.y;
        return dx * dx + dy * dy < (this.radius + 10) * (this.radius + 10);
      }
      explode() {
        if (this.exploded) return;
        this.exploded = true;
        createExplosion(this.x, this.y);
      }
    }

    // 粒子类
    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1;
        this.decay = Math.random() * 0.02 + 0.015;
        this.size = Math.random() * 5 + 2;
        this.color = color;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.15;
        this.vx *= 0.98;
        this.life -= this.decay;
      }
      draw() {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function createExplosion(x, y) {
      const colors = ['#ff4d4f', '#ff7a45', '#ffa940', '#ffec3d', '#fff'];
      for (let i = 0; i < 60; i++) {
        particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
      }
      // 冲击波
      particles.push({
        x, y, radius: 5, maxRadius: 80, life: 1,
        update() { this.radius += 4; this.life -= 0.05; },
        draw() {
          ctx.globalAlpha = this.life * 0.5;
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      });
    }

    function initBombs() {
      bombs = [];
      const count = 6;
      const boxW = 380, boxH = 480;
      const boxX = W / 2 - boxW / 2, boxY = H / 2 - boxH / 2;
      for (let i = 0; i < count; i++) {
        let x, y, valid = false, attempts = 0;
        while (!valid && attempts < 50) {
          x = Math.random() * (W - 100) + 50;
          y = Math.random() * (H - 100) + 50;
          // 避开登录框
          if (x > boxX - 60 && x < boxX + boxW + 60 && y > boxY - 60 && y < boxY + boxH + 60) {
            attempts++;
            continue;
          }
          valid = true;
        }
        if (valid) bombs.push(new Bomb(x, y));
      }
    }

    function loop() {
      try {
        ctx.fillStyle = bgGradient;
        ctx.fillRect(0, 0, W, H);
        // 背景星星
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        for (let i = 0; i < 50; i++) {
          const sx = (i * 137.5) % W;
          const sy = (i * 97.3) % H;
          ctx.fillRect(sx, sy, 1.5, 1.5);
        }
        bombs = bombs.filter(b => !b.exploded);
        bombs.forEach(b => { b.update(); b.draw(); });
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update();
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          p.draw();
        }
      } catch (e) { console.error('动画帧错误:', e); }
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('click', (e) => {
      if (isDead) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      bombs.forEach(b => {
        if (b.contains(x, y)) b.explode();
      });
    });

    // 登录失败触发全图爆炸
    function triggerDeath(message) {
      if (isDead) return;
      isDead = true;
      document.body.classList.add('death');
      document.querySelector('.death-sub').textContent =
        message || '用户名或密码错误，炸弹已被引爆';
      let delay = 0;
      bombs.forEach((b) => {
        setTimeout(() => {
          b.explode();
          if (navigator.vibrate) navigator.vibrate(100);
        }, delay);
        delay += 200;
      });
      setTimeout(() => {
        // 中心大爆炸
        createExplosion(W / 2, H / 2);
        createExplosion(W / 3, H / 3);
        createExplosion(W * 2 / 3, H * 2 / 3);
      }, delay + 200);
      setTimeout(() => {
        document.getElementById('deathOverlay').classList.add('show');
      }, delay + 800);
    }

    function respawn() {
      isDead = false;
      document.body.classList.remove('death');
      document.getElementById('deathOverlay').classList.remove('show');
      initBombs();
      particles = [];
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isDead) return;
      const submitButton = e.currentTarget.querySelector('button[type="submit"]');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        await UI.withSpinner(submitButton, async () => {
          const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json().catch(() => ({}));

          if (data.success) {
            UI.toast('登录成功，正在跳转', 'success', 1200);
            setTimeout(() => {
              window.location.href = data.redirect || '/success.html';
            }, 500);
            return;
          }

          triggerDeath(data.error || '用户名或密码错误，炸弹已被引爆');
        });
      } catch (error) {
        triggerDeath('无法连接服务器，请检查服务是否已启动');
      }
    });

    initBombs();
    loop();
  </script>
</body>
</html>
