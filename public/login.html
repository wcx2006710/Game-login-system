<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    #gameCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }
    .login-wrapper {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .login-box {
      pointer-events: auto;
      background: rgba(255,255,255,0.95);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      width: 360px;
      backdrop-filter: blur(10px);
    }
    h2 { text-align: center; color: #333; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }
    input:focus { border-color: #667eea; }
    button {
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #5568d3; }
    .hint {
      margin-top: 20px;
      padding: 12px;
      background: #f5f5f5;
      border-radius: 6px;
      font-size: 12px;
      color: #888;
      line-height: 1.8;
    }
    .bomb-tip {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      z-index: 10;
      pointer-events: none;
    }
    /* 死亡覆盖层 */
    #deathOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.5s;
    }
    #deathOverlay.show { display: flex; }
    .death-text {
      font-size: 72px;
      color: #ff4d4f;
      font-weight: bold;
      text-shadow: 0 0 30px #ff4d4f;
      margin-bottom: 20px;
      animation: shake 0.5s infinite;
    }
    .death-sub {
      font-size: 20px;
      color: #fff;
      margin-bottom: 40px;
    }
    .retry-btn {
      padding: 14px 40px;
      background: #ff4d4f;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .retry-btn:hover { transform: scale(1.05); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }
    body.death { animation: screenShake 0.3s; }
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-10px, 5px); }
      40% { transform: translate(10px, -5px); }
      60% { transform: translate(-5px, 10px); }
      80% { transform: translate(5px, -10px); }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div class="login-wrapper">
    <div class="login-box">
      <h2>用户登录</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="username" name="username" required placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" name="password" required placeholder="请输入密码">
        </div>
        <button type="submit">登 录</button>
      </form>
      <div class="hint">
        测试账号：<br>
        admin / 123456<br>
        test / test123<br>
        alice / alice888
      </div>
    </div>
  </div>

  <div class="bomb-tip">💡 点击背景中的炸弹会爆炸，登录失败会触发全图爆炸！</div>

  <div id="deathOverlay">
    <div class="death-text">💥 你被炸死了 💥</div>
    <div class="death-sub">用户名或密码错误，炸弹已被引爆</div>
    <button class="retry-btn" onclick="respawn()">重新来过</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    let bombs = [];
    let particles = [];
    let isDead = false;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // 炸弹类
    class Bomb {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 22;
        this.exploded = false;
        this.pulse = Math.random() * Math.PI * 2;
        this.floatOffset = Math.random() * Math.PI * 2;
        this.baseY = y;
      }
      update() {
        this.pulse += 0.05;
        this.floatOffset += 0.02;
        this.y = this.baseY + Math.sin(this.floatOffset) * 8;
      }
      draw() {
        if (this.exploded) return;
        const scale = 1 + Math.sin(this.pulse) * 0.08;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(scale, scale);
        // 引线
        ctx.strokeStyle = '#8B4513';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(5, -this.radius + 2);
        ctx.quadraticCurveTo(15, -this.radius - 10, 20, -this.radius - 5);
        ctx.stroke();
        // 火花
        ctx.fillStyle = '#ff6600';
        ctx.beginPath();
        ctx.arc(20, -this.radius - 5, 3 + Math.sin(this.pulse * 3) * 1.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(20, -this.radius - 5, 1.5, 0, Math.PI * 2);
        ctx.fill();
        // 炸弹主体
        const gradient = ctx.createRadialGradient(-5, -5, 2, 0, 0, this.radius);
        gradient.addColorStop(0, '#555');
        gradient.addColorStop(1, '#1a1a1a');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fill();
        // 高光
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.arc(-7, -7, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      contains(px, py) {
        const dx = px - this.x, dy = py - this.y;
        return dx * dx + dy * dy < (this.radius + 10) * (this.radius + 10);
      }
      explode() {
        if (this.exploded) return;
        this.exploded = true;
        createExplosion(this.x, this.y);
      }
    }

    // 粒子类
    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1;
        this.decay = Math.random() * 0.02 + 0.015;
        this.size = Math.random() * 5 + 2;
        this.color = color;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.15;
        this.vx *= 0.98;
        this.life -= this.decay;
      }
      draw() {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function createExplosion(x, y) {
      const colors = ['#ff4d4f', '#ff7a45', '#ffa940', '#ffec3d', '#fff'];
      for (let i = 0; i < 60; i++) {
        particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
      }
      // 冲击波
      particles.push({
        x, y, radius: 5, maxRadius: 80, life: 1,
        update() { this.radius += 4; this.life -= 0.05; },
        draw() {
          ctx.globalAlpha = this.life * 0.5;
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      });
    }

    function initBombs() {
      bombs = [];
      const count = 6;
      const boxW = 360, boxH = 450;
      const boxX = W / 2 - boxW / 2, boxY = H / 2 - boxH / 2;
      for (let i = 0; i < count; i++) {
        let x, y, valid = false, attempts = 0;
        while (!valid && attempts < 50) {
          x = Math.random() * (W - 100) + 50;
          y = Math.random() * (H - 100) + 50;
          // 避开登录框
          if (x > boxX - 60 && x < boxX + boxW + 60 && y > boxY - 60 && y < boxY + boxH + 60) {
            attempts++;
            continue;
          }
          valid = true;
        }
        if (valid) bombs.push(new Bomb(x, y));
      }
    }

    function loop() {
      try {
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, W, H);
        // 背景星星
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        for (let i = 0; i < 50; i++) {
          const sx = (i * 137.5) % W;
          const sy = (i * 97.3) % H;
          ctx.fillRect(sx, sy, 1.5, 1.5);
        }
        bombs = bombs.filter(b => !b.exploded);
        bombs.forEach(b => { b.update(); b.draw(); });
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update();
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          p.draw();
        }
      } catch (e) { console.error('动画帧错误:', e); }
      requestAnimationFrame(loop);
    }

    canvas.addEventListener('click', (e) => {
      if (isDead) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      bombs.forEach(b => {
        if (b.contains(x, y)) b.explode();
      });
    });

    // 登录失败触发全图爆炸
    function triggerDeath() {
      isDead = true;
      document.body.classList.add('death');
      let delay = 0;
      bombs.forEach((b, i) => {
        setTimeout(() => {
          b.explode();
          if (navigator.vibrate) navigator.vibrate(100);
        }, delay);
        delay += 200;
      });
      setTimeout(() => {
        // 中心大爆炸
        createExplosion(W / 2, H / 2);
        createExplosion(W / 3, H / 3);
        createExplosion(W * 2 / 3, H * 2 / 3);
      }, delay + 200);
      setTimeout(() => {
        document.getElementById('deathOverlay').classList.add('show');
      }, delay + 800);
    }

    function respawn() {
      isDead = false;
      document.body.classList.remove('death');
      document.getElementById('deathOverlay').classList.remove('show');
      initBombs();
      particles = [];
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (isDead) return;
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = data.redirect;
      } else {
        triggerDeath();
      }
    });

    initBombs();
    loop();
  </script>
</body>
</html>
